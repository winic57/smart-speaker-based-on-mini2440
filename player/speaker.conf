# mini2440 智能音箱 player 配置文件
# 用法: ./player [配置文件路径]，不带参数默认读 /etc/speaker.conf

# 服务器地址（RedHat5 虚拟机/电脑上的 server）
server_ip=192.168.50.129
server_port=8000

# 音箱设备 ID
device_id=001

# 音乐根目录，下面按「第1季」到「第12季」分文件夹
music_path=/sdcard/

# 每次开始播放后，播满这么多分钟自动停。0 表示不限时
play_minutes=30

# madplay 可执行文件路径
madplay_path=/bin/madplay

# 保活间隔（秒）
keepalive=5
